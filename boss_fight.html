<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spider-Man vs Green Goblin</title>
    <link rel="icon" type="image/jpeg" href="assets/favicon.jpeg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');

        body {
            margin: 0;
            background: #050505;
            color: white;
            font-family: 'Bangers', cursive, system-ui;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        /* --- OVERLAY DE INÍCIO --- */
        #start-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #start-overlay h2 {
            font-size: clamp(40px, 10vw, 70px);
            color: #ff0000;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            -webkit-filter: drop-shadow(0 0 10px red);
            animation: pulse 1.5s infinite;
            margin: 0;
        }

        #start-overlay p {
            font-size: 20px;
            color: #888;
            margin-top: 10px;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .nav-button-game {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #000;
            border: 2px solid #ff0000;
            color: #ff0000;
            padding: 8px 20px;
            cursor: pointer;
            z-index: 1000;
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
            transform: skew(-15deg);
        }

        .nav-button-game:hover {
            background: #ff0000;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
        }

        #game-wrapper {
            position: relative;
            border: 3px solid #333;
            background: #000;
            width: 95vw;
            max-width: 850px;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            z-index: 1;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
            image-rendering: pixelated;
        }

        #hud {
            position: absolute;
            top: 10px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .hud-side {
            display: flex;
            align-items: center;
        }

        .icon {
            width: clamp(35px, 10vw, 65px);
            height: clamp(35px, 10vw, 65px);
            border-radius: 50%;
            background-size: cover;
            border: 2px solid #fff;
        }

        .player-icon {
            background-image: url('assets/icon-aranha.jpeg');
            box-shadow: 0 0 15px #ff0000;
            margin-right: 10px;
        }

        .boss-icon {
            background-image: url('assets/icon-duende.jpeg');
            box-shadow: 0 0 15px #00ff00;
            margin-left: 10px;
        }

        .bar-container {
            width: clamp(80px, 20vw, 220px);
            height: 18px;
            border: 2px solid #fff;
            background: rgba(0, 0, 0, 0.7);
            transform: skew(-15deg);
            overflow: hidden;
        }

        .hp-bar {
            height: 100%;
            transition: width 0.3s ease;
        }

        #player-hp {
            background: #ff0000;
            width: 100%;
            box-shadow: 0 0 10px #ff0000;
        }

        #boss-hp {
            background: #00ff00;
            width: 100%;
            float: right;
            box-shadow: 0 0 10px #00ff00;
        }

        #vs-tag {
            font-size: clamp(20px, 5vw, 32px);
            margin: 0 15px;
            text-shadow: 2px 2px #000;
            color: #fff;
        }

        /* --- JOYSTICK --- */
        #mobile-controls {
            display: none;
            width: 100%;
            max-width: 700px;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            position: relative;
            height: 150px;
        }

        #joystick-container {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            position: relative;
            touch-action: none;
        }

        #joystick-stick {
            width: 50px;
            height: 50px;
            background: #3498db;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.7);
            pointer-events: none;
        }

        .btn-attack {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: #ff0000;
            color: white;
            border: 3px solid #fff;
            font-family: 'Bangers';
            font-size: 22px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        #end-screen {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .victory-title {
            font-size: clamp(40px, 15vw, 90px);
            margin: 0;
            text-align: center;
        }

        .spider-wins {
            color: #ff0000;
            text-shadow: 0 0 30px #ff0000;
        }

        .duende-wins {
            color: #00ff00;
            text-shadow: 0 0 30px #00ff00;
        }

        .btn-restart {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 24px;
            background: #e62429;
            color: white;
            border: 2px solid #fff;
            cursor: pointer;
            font-family: 'Bangers';
            transform: skew(-15deg);
        }

        #controls-info {
            margin-top: 15px;
            font-size: 16px;
            color: #888;
        }

        /* --- RESPONSIVIDADE TABLET --- */

        @media (max-width: 1188px) {
            #mobile-controls {
                display: flex;
            }

            #controls-info {
                display: none;
            }
        }

        /* Ajustes específicos para Tablet (769px até 1188px) */
        @media (min-width: 769px) and (max-width: 1188px) {
            #game-wrapper {
                max-width: 950px;
                max-height: 70vh;
                border-color: #ff0000;
                box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
            }

            #mobile-controls {
                max-width: 900px;
                height: 180px;
            }

            #joystick-container {
                width: 140px;
                height: 140px;
            }

            .btn-attack {
                width: 100px;
                height: 100px;
                font-size: 26px;
            }
        }

        @media (max-width: 768px) {
            #game-wrapper {
                border-color: #ff0000;
                box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
                max-height: 60vh;
            }
        }
    </style>
</head>

<body>

    <div id="start-overlay" onclick="startGame()">
        <h2>CLICK TO FIGHT</h2>
        <p>GET READY!</p>
    </div>

    <a href="index.html" class="nav-button-game">
        < BACK</a>

            <div id="game-wrapper">
                <div id="hud">
                    <div class="hud-side">
                        <div class="icon player-icon"></div>
                        <div class="bar-container">
                            <div id="player-hp" class="hp-bar"></div>
                        </div>
                    </div>
                    <div id="vs-tag">VS</div>
                    <div class="hud-side">
                        <div class="bar-container">
                            <div id="boss-hp" class="hp-bar"></div>
                        </div>
                        <div class="icon boss-icon"></div>
                    </div>
                </div>

                <div id="end-screen">
                    <h1 id="winner-message" class="victory-title"></h1>
                    <button class="btn-restart" onclick="location.reload()">PLAY AGAIN</button>
                </div>

                <canvas id="gameCanvas"></canvas>
            </div>

            <div id="mobile-controls">
                <div id="joystick-container">
                    <div id="joystick-stick"></div>
                </div>
                <button class="btn-attack" id="m-attack">WEB</button>
            </div>

            <div id="controls-info">
                [W] [A] [S] [D] Move | [F] Atacar
            </div>

            <audio id="bgMusic" loop>
                <source src="assets/cuphead-style.mp3" type="audio/mpeg">
            </audio>

            <script>
                const canvas = document.getElementById('gameCanvas');
                const ctx = canvas.getContext('2d');
                const bgMusic = document.getElementById('bgMusic');

                canvas.width = 800;
                canvas.height = 500;

                let gameRunning = false;
                let frame = 0;
                const keys = {};
                const webs = [];
                const bombs = [];

                let joyActive = false;
                let joyX = 0;
                let joyY = 0;
                let joystickTouchId = null;

                const imgBG = new Image(); imgBG.src = 'assets/img-fundo4.png';
                const player = { x: 100, y: 350, radius: 25, hp: 100, speed: 7 };
                const boss = { x: 600, y: 200, size: 40, hp: 100, angle: 0 };

                function startGame() {
                    document.getElementById('start-overlay').style.display = 'none';
                    bgMusic.play().catch(e => console.log("Erro ao tocar música:", e));
                    gameRunning = true;
                    loop();
                }

                const joyContainer = document.getElementById('joystick-container');
                const joyStick = document.getElementById('joystick-stick');

                joyContainer.addEventListener('touchstart', (e) => {
                    const touch = e.changedTouches[0];
                    joystickTouchId = touch.identifier;
                    joyActive = true;
                    handleJoy(e, touch);
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    if (joyActive) {
                        for (let i = 0; i < e.touches.length; i++) {
                            if (e.touches[i].identifier === joystickTouchId) {
                                handleJoy(e, e.touches[i]);
                                break;
                            }
                        }
                    }
                }, { passive: false });

                window.addEventListener('touchend', (e) => {
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === joystickTouchId) {
                            joyActive = false;
                            joystickTouchId = null;
                            joyX = 0; joyY = 0;
                            joyStick.style.transform = `translate(-50%, -50%)`;
                            break;
                        }
                    }
                });

                function handleJoy(e, touch) {
                    if (e.cancelable) e.preventDefault();
                    const rect = joyContainer.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    const maxDist = rect.width / 2;

                    let dx = touch.clientX - centerX;
                    let dy = touch.clientY - centerY;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > maxDist) {
                        dx *= maxDist / dist;
                        dy *= maxDist / dist;
                    }

                    joyStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                    joyX = dx / maxDist;
                    joyY = dy / maxDist;
                }

                window.addEventListener('keydown', e => {
                    keys[e.code] = true;
                    if (e.code === 'KeyF' && gameRunning) shootWeb();
                });
                window.addEventListener('keyup', e => keys[e.code] = false);

                document.getElementById('m-attack').addEventListener('touchstart', (e) => {
                    if (e.cancelable) e.preventDefault();
                    if (gameRunning) shootWeb();
                }, { passive: false });

                function shootWeb() {
                    webs.push({ x: player.x + player.radius, y: player.y, s: 15 });
                }

                function showResult(msg, isSpider) {
                    gameRunning = false;
                    const screen = document.getElementById('end-screen');
                    const text = document.getElementById('winner-message');
                    text.innerText = msg;
                    text.className = isSpider ? 'victory-title spider-wins' : 'victory-title duende-wins';
                    screen.style.display = 'flex';
                }

                function update() {
                    if (!gameRunning) return;
                    frame++;

                    let moveX = 0;
                    let moveY = 0;

                    if (keys['KeyW']) moveY = -1;
                    if (keys['KeyS']) moveY = 1;
                    if (keys['KeyA']) moveX = -1;
                    if (keys['KeyD']) moveX = 1;

                    if (joyActive) {
                        moveX = joyX;
                        moveY = joyY;
                    }

                    player.x += moveX * player.speed;
                    player.y += moveY * player.speed;

                    if (player.y < 80) player.y = 80;
                    if (player.y > canvas.height - 40) player.y = canvas.height - 40;
                    if (player.x < 40) player.x = 40;
                    if (player.x > 380) player.x = 380;

                    boss.angle += 0.045;
                    boss.x = 550 + Math.sin(boss.angle) * 160;
                    boss.y = 220 + Math.sin(boss.angle * 2.2) * 140;

                    if (frame % 40 === 0) {
                        bombs.push({ x: boss.x, y: boss.y, vx: -9, vy: (Math.random() - 0.5) * 8 });
                    }

                    webs.forEach((web, i) => {
                        web.x += web.s;
                        let dx = web.x - boss.x;
                        let dy = web.y - boss.y;
                        if (Math.sqrt(dx * dx + dy * dy) < boss.size) {
                            boss.hp -= 3;
                            webs.splice(i, 1);
                            document.getElementById('boss-hp').style.width = Math.max(0, boss.hp) + "%";
                        }
                    });

                    bombs.forEach((bomb, i) => {
                        bomb.x += bomb.vx; bomb.y += bomb.vy;
                        let dx = bomb.x - player.x;
                        let dy = bomb.y - player.y;
                        if (Math.sqrt(dx * dx + dy * dy) < player.radius + 10) {
                            player.hp -= 12;
                            bombs.splice(i, 1);
                            document.getElementById('player-hp').style.width = Math.max(0, player.hp) + "%";
                        }
                        if (bomb.x < -20) bombs.splice(i, 1);
                    });

                    if (boss.hp <= 0) showResult("SPIDER-MAN WINS!", true);
                    if (player.hp <= 0) showResult("DUENDE WINS!", false);
                }

                function draw() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(imgBG, 0, 0, canvas.width, canvas.height);

                    ctx.shadowBlur = 15; ctx.shadowColor = "red";
                    ctx.fillStyle = "#ff0000";
                    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke();

                    ctx.shadowColor = "#0f0";
                    ctx.fillStyle = "#2e8b57";
                    ctx.beginPath();
                    ctx.moveTo(boss.x + boss.size, boss.y);
                    ctx.lineTo(boss.x - boss.size, boss.y - boss.size);
                    ctx.lineTo(boss.x - boss.size, boss.y + boss.size);
                    ctx.closePath(); ctx.fill();
                    ctx.strokeStyle = "yellow"; ctx.stroke();

                    ctx.shadowBlur = 0;
                    ctx.fillStyle = "#fff";
                    webs.forEach(w => ctx.fillRect(w.x, w.y - 3, 22, 6));

                    ctx.fillStyle = "#ffa500";
                    bombs.forEach(b => {
                        ctx.beginPath(); ctx.arc(b.x, b.y, 12, 0, Math.PI * 2); ctx.fill();
                    });
                }

                function loop() {
                    if (!gameRunning) return;
                    update();
                    draw();
                    requestAnimationFrame(loop);
                }

                imgBG.onload = () => {
                    ctx.drawImage(imgBG, 0, 0, canvas.width, canvas.height);
                };
            </script>
</body>

</html>
